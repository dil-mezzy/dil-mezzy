<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
<title id="title">Moiz Ezzy: personal contributions</title>
<desc id="desc">Personal commits, pull requests, issues, and reviews over the past 365 days. Includes public repositories and selected private repositories without double-counting.</desc>
<rect x="1" y="1" width="418" height="278" rx="14" fill="#171b32" stroke="#424c70"/>
<g font-family="system-ui, sans-serif">
<text x="22" y="32" fill="#a9b8ff" font-size="18" font-weight="600">Moiz Ezzy: personal contributions</text>
<text x="22" y="54" fill="#a6accd" font-size="11">Past 365 days · public + selected private repositories</text>
<circle cx="27" cy="83" r="4" fill="#77e4d2"/>
<text x="41" y="87" fill="#dce4ff" font-size="13">Commits</text>
<text x="397" y="87" fill="#a9b8ff" font-size="13" text-anchor="end">11</text>
<circle cx="27" cy="111" r="4" fill="#77e4d2"/>
<text x="41" y="115" fill="#dce4ff" font-size="13">Pull requests opened</text>
<text x="397" y="115" fill="#a9b8ff" font-size="13" text-anchor="end">0</text>
<circle cx="27" cy="139" r="4" fill="#77e4d2"/>
<text x="41" y="143" fill="#dce4ff" font-size="13">Issues opened</text>
<text x="397" y="143" fill="#a9b8ff" font-size="13" text-anchor="end">0</text>
<circle cx="27" cy="167" r="4" fill="#77e4d2"/>
<text x="41" y="171" fill="#dce4ff" font-size="13">Pull request reviews</text>
<text x="397" y="171" fill="#a9b8ff" font-size="13" text-anchor="end">0</text>
<circle cx="27" cy="195" r="4" fill="#77e4d2"/>
<text x="41" y="199" fill="#dce4ff" font-size="13">Total of the above</text>
<text x="397" y="199" fill="#a9b8ff" font-size="13" text-anchor="end">11</text>
<circle cx="27" cy="223" r="4" fill="#77e4d2"/>
<text x="41" y="227" fill="#dce4ff" font-size="13">From selected repos (included)</text>
<text x="397" y="227" fill="#a9b8ff" font-size="13" text-anchor="end">11</text>
<text x="22" y="264" fill="#a6accd" font-size="11">Selected-repo activity is included, not added twice.</text>
</g></svg>
